services:
  postgres:
    image: postgres:16
    container_name: landpredict-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: landpredict
      POSTGRES_USER: landpredict
      POSTGRES_PASSWORD: landpredict123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: